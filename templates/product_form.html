{% extends "base.html" %}
{% block title %}{{ 'Edit product' if editing else 'Add product' }}{% endblock %}
{% block content %}
        <section class="product-panel">
          <div class="section-title">
            <h2>{{ 'Edit product' if editing else 'Add a product' }}</h2>
            <a href="{{ url_for('products') }}">Back to products</a>
          </div>

          <form method="post" class="form-grid"
                action="{{ url_for('product_edit', product_id=product_id) if editing else url_for('product_new') }}">
            <label class="full">Product name
              <input type="text" name="name" value="{{ product.name or '' }}" maxlength="120" required />
            </label>

            <label>Category
              <select name="category_id" required>
                <option value="">Choose…</option>
                {% for c in categories %}
                <option value="{{ c.id }}" {{ 'selected' if product.category_id|string == c.id|string }}>{{ c.name }}</option>
                {% endfor %}
              </select>
            </label>

            <label>Price (R)
              <input type="number" name="price" value="{{ product.price if product.price is not none else '' }}" min="0" step="0.01" required />
            </label>

            <label>Stock on hand
              <input type="number" name="stock" value="{{ product.stock if product.stock is not none else '' }}" min="0" step="1" required />
            </label>

            <label>Reorder level
              <input type="number" name="reorder_level" value="{{ product.reorder_level if product.reorder_level is not none else '' }}" min="0" step="1" required />
            </label>

            <div class="full">
              <button class="primary-btn">{{ 'Save changes' if editing else 'Add product' }}</button>
            </div>
          </form>
        </section>
{% endblock %}
