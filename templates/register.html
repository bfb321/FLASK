{% extends "base.html" %}
{% block content %}
        <section class="product-panel">
          <div class="section-title">
            <h2>Register your business</h2>
            <a href="{{ url_for('users') }}">View users</a>
          </div>

          <form method="post" action="{{ url_for('register') }}" class="form-grid" novalidate>
            <label>First Name
              <input type="text" name="firstName" value="{{ form.firstName }}" required>
            </label>
            <label>Last Name
              <input type="text" name="lastName" value="{{ form.lastName }}" required>
            </label>
            <label>Business Name
              <input type="text" name="businessName" value="{{ form.businessName }}" required>
            </label>
            <label>Email Address
              <input type="email" name="email" value="{{ form.email }}" required>
            </label>
            <label>Phone Number
              <input type="tel" name="phone" value="{{ form.phone }}" required>
            </label>
            <label class="full">Business Address
              <textarea name="address" rows="2" required>{{ form.address }}</textarea>
            </label>
            <label>Password
              <input type="password" name="password" minlength="8" required>
            </label>
            <label>Confirm Password
              <input type="password" name="confirmPassword" minlength="8" required>
            </label>
            <div class="full">
              <button type="submit" class="primary-btn">Create account</button>
            </div>
          </form>
        </section>
{% endblock %}
