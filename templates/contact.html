<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2f6fed;
        --primary-dark: #1d4fb3;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .container {
        width: min(100%, 900px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(31, 41, 55, 0.08);
      }

      .content {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
      }

      .info {
        padding: 48px 36px;
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
      }

      .info h1 {
        margin: 0 0 16px;
        font-size: 2.2rem;
      }

      .info p {
        margin: 0 0 28px;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.84);
      }

      .contact-list {
        display: grid;
        gap: 18px;
      }

      .item {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        color: rgba(255, 255, 255, 0.92);
      }

      .icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
      }

      .form-panel {
        padding: 48px 36px;
      }

      .form-panel h2 {
        margin: 0 0 10px;
        font-size: 1.8rem;
      }

      .form-panel .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 18px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
        color: var(--text);
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit;
        background: #fff;
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.12);
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      button {
        border: none;
        background: var(--primary);
        color: white;
        border-radius: 10px;
        padding: 14px 18px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
      }

      @media (max-width: 760px) {
        .content {
          grid-template-columns: 1fr;
        }

        .row {
          grid-template-columns: 1fr;
        }

        .info,
        .form-panel {
          padding: 32px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <aside class="info">
          <h1>Contact Us</h1>
          <p>
            We’d love to hear from you. Reach out with questions, feedback, or
            partnership opportunities.
          </p>

          <div class="contact-list">
            <div class="item">
              <div class="icon">📍</div>
              <div>
                <strong>Address</strong><br />
                123 Market Street, Suite 400<br />
                San Francisco, CA 94103
              </div>
            </div>

            <div class="item">
              <div class="icon">☎️</div>
              <div>
                <strong>Phone</strong><br />
                +1 (415) 555-0199
              </div>
            </div>

            <div class="item">
              <div class="icon">✉️</div>
              <div>
                <strong>Email</strong><br />
                hello@example.com
              </div>
            </div>
          </div>
        </aside>

        <main class="form-panel">
          <h2>Send a message</h2>
          <p class="subtitle">Fill out the form below and we’ll get back to you soon.</p>

          <form>
            <div class="row">
              <label>
                First Name
                <input type="text" name="firstName" placeholder="John" />
              </label>
              <label>
                Last Name
                <input type="text" name="lastName" placeholder="Doe" />
              </label>
            </div>

            <label>
              Email Address
              <input type="email" name="email" placeholder="john@example.com" />
            </label>

            <label>
              Subject
              <input type="text" name="subject" placeholder="How can we help?" />
            </label>

            <label>
              Message
              <textarea name="message" placeholder="Write your message here..."></textarea>
            </label>

            <button type="submit">Send Message</button>
          </form>
        </main>
      </div>
    </div>
  </body>
</html>
